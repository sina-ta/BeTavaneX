name: Stage 27 CI — Live Pilot Analytics

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SKIP_STARTUP_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Stage 27 adoption analytics
        run: python backend/scripts/stage27_adoption_analytics.py

      - name: Stage 27 live pilot verification
        run: python backend/scripts/stage27_live_pilot_verification.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: betavanx_app
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: betavanx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betavanx_app -d betavanx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://betavanx_app:ci_secret@localhost:5432/betavanx_ci
      SKIP_STARTUP_VALIDATION: "false"
      REQUIRE_ALEMBIC_HEAD: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install and bootstrap
        run: |
          pip install -r requirements.txt
          python backend/scripts/phase1_init_schema.py
          alembic -c backend/alembic.ini upgrade head
          python backend/scripts/seed_platform_users.py

      - name: Stage 27 API verification with Postgres
        run: python backend/scripts/stage27_live_pilot_verification.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
