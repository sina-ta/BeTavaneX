name: Stage 24 CI — Operational Scale

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SKIP_STARTUP_VALIDATION: "true"
      LOAD_TEST_USERS: "50"
      LOAD_TEST_ITERATIONS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Stage 24 runtime verification
        run: python backend/scripts/stage24_runtime_verification.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: betavanx_app
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: betavanx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betavanx_app -d betavanx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://betavanx_app:ci_secret@localhost:5432/betavanx_ci
      SKIP_STARTUP_VALIDATION: "false"
      REQUIRE_ALEMBIC_HEAD: "false"
      RUN_POSTGRES_VALIDATION: "true"
      LOAD_TEST_USERS: "30"
      LOAD_TEST_ITERATIONS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap schema
        run: python backend/scripts/phase1_init_schema.py

      - name: Alembic upgrade
        run: alembic -c backend/alembic.ini upgrade head

      - name: Seed platform users
        run: python backend/scripts/seed_platform_users.py

      - name: Stage 24 Postgres + Alembic validation
        run: |
          python backend/scripts/stage24_alembic_validation.py
          python backend/scripts/stage24_postgres_validation.py
          python backend/scripts/stage24_iam_verification.py
          python backend/scripts/stage22_postgres_validation.py
          python backend/scripts/stage23_postgres_performance_audit.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
