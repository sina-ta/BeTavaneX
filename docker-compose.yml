# BetavanX — lightweight local / staging / production-like stack (no Kubernetes)
#
# Usage:
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up --build
#
# Staging/production: set APP_ENV, LOG_JSON=true, REQUIRE_ALEMBIC_HEAD=true in .env.docker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betavanx_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      POSTGRES_DB: ${POSTGRES_DB:-betavanx_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - betavanx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-betavanx_app} -d ${POSTGRES_DB:-betavanx_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-betavanx_app}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-betavanx_dev}
      BETAVANX_AUTH_SECRET: ${BETAVANX_AUTH_SECRET:-dev-secret-change-me}
      BETAVANX_AUTH_TOKEN_TTL: ${BETAVANX_AUTH_TOKEN_TTL:-3600}
      BETAVANX_CORS_ORIGINS: ${BETAVANX_CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      REQUIRE_ALEMBIC_HEAD: ${REQUIRE_ALEMBIC_HEAD:-false}
      SKIP_STARTUP_VALIDATION: ${SKIP_STARTUP_VALIDATION:-false}
      RUN_SCHEMA_BOOTSTRAP: ${RUN_SCHEMA_BOOTSTRAP:-false}
      RUN_ALEMBIC_UPGRADE: ${RUN_ALEMBIC_UPGRADE:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  betavanx_pgdata:
